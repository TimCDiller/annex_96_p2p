# Mock backend at the size of the real Annex 96 Common Exercise 1
# neighbourhood: 25 buildings, five teams of five.
#
# The point of this file is transferability. A lab run here uses the same
# building count and the same `assignments:` block as the CityLearn backend,
# so switching to the real homes is a two-line change:
#
#     backend: citylearn
#     citylearn_schema: ../annex96_ce1/data/datasets/annex96_ce1_tx_neighborhood/schema.json
#
# (The building NAMES differ -- CityLearn uses the ResStock ids -- so the
# assignments below need remapping when you switch. See docs/citylearn.md.)

backend: mock
days: 7
n_buildings: 25          # exact count; overrides n_per_archetype

submissions: submissions
default_agent: rbc
unclaimed_mode: individual
conflict_policy: first

# --- prices ----------------------------------------------------------------
price_csv:
delivery_adder: 0.075
price_volatility: 0.15
export_price: 0.0        # CE1 rule: no export to the grid
comfort_price: 3.0
price_step: 0.01

# --- guard rails -----------------------------------------------------------
max_bid_kwh: 500.0
slow_call_seconds: 1.0
seed: 0

# --- the partition ---------------------------------------------------------
# 25 is not a multiple of four, so the archetypes come out slightly uneven:
# seven solar-rich and six of each of the others. Archetypes cycle in order,
# so B01/B05/B09/... are always solar-rich.
#
#   solar-rich    B01 B05 B09 B13 B17 B21 B25
#   storage-rich  B02 B06 B10 B14 B18 B22
#   thermal-mass  B03 B07 B11 B15 B19 B23
#   balanced      B04 B08 B12 B16 B20 B24
#
# Four specialised teams plus one holding the remainder. Specialisation is
# what keeps the market alive -- see the table in the README, and run
# `python examples/check_partition.py` to measure any partition of your own.
#
# team_epsilon is deliberately the mixed one. It can balance itself
# internally and will therefore trade far less than the others, which makes
# a good live demonstration of why the partition matters -- but it also
# means its score is not quite like-for-like. Rotate the assignment between
# labs if you are grading on it.

# Left off so `run` stays friendly for a student experimenting locally with
# a submission that is not in the table below. `tournament` switches it on
# automatically whenever assignments are present, so the graded run is
# strict without this needing to be set here.
strict_assignments: false
assignments:
  team_alpha:   [B01, B05, B09, B13, B17]   # all solar     -> structural seller
  team_beta:    [B02, B06, B10, B14, B18]   # all storage   -> arbitrageur
  team_gamma:   [B03, B07, B11, B15, B19]   # all mass      -> flexible load only
  team_delta:   [B04, B08, B12, B16, B20]   # all balanced  -> both sides
  team_epsilon: [B21, B22, B23, B24, B25]   # mixed         -> self-balancing

out: results/ce1_scale
save_csv: true
