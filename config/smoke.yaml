# Fast sanity run. This is what `make smoke` uses.
# 2 days x 12 buildings finishes in well under a second, so the very first
# thing you do after cloning gives you an answer immediately.
backend: mock
days: 2
n_per_archetype: 3

submissions: submissions
default_agent: rbc
unclaimed_mode: individual
conflict_policy: first

export_price: 0.0        # CE1 rule kept: no export to the grid
comfort_price: 3.0       # $ per degC-hour outside the comfort band
price_step: 0.01         # bid price resolution
delivery_adder: 0.075

# --- how much compute a submission may use ---------------------------------
# call_timeout_seconds: the most a single bid() or dispatch() call may take.
#   Overrun it and that timestep gets an EMPTY BID (or idle actions), which is
#   flagged in the COMPUTE section of the report. 0 disables it.
#   The shipped example agent uses about 0.02 s per run in total, so 5 s is
#   very roomy -- it is sized for a first call that also pays for lazy torch
#   imports and building a model in reset().
# run_budget_seconds: total wall-clock a single participant may spend across
#   the WHOLE run. Exhausting it disqualifies that participant for the
#   remainder: empty bids, idle actions, agent never called again. This is
#   what bounds a submission that hangs, since an abandoned thread cannot be
#   killed. 0 disables it.
call_timeout_seconds: 5.0
run_budget_seconds: 120.0

out: results/smoke
save_csv: true
