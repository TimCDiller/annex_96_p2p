# The Annex 96 Common Exercise 1 neighbourhood: 25 ResStock homes.
#
# Two datasets ship, and they are different control problems. This config runs
# VERMONT. To switch, point `citylearn_schema` at the other one and re-run
# `python -m annex96p2p buildings` -- the two share no building ids, so every
# submission's BUILDINGS list has to be re-issued as well.
#
#   annex96_ce1_vt_neighborhood   January, heating_device actuated, 743 steps
#   annex96_ce1_tx_neighborhood   June,    cooling_device actuated, 719 steps
#
# Which one you want depends on what the exercise is FOR. In the Vermont
# January the peer-to-peer market moves about 1% of the energy, because only
# ~1% of participant-hours are net producing and a 2.9 kW battery discharge
# cannot dent a 19.5 kW compressor -- so bidding barely separates the agents.
# Texas in June puts real PV surplus into the middle of the day, which is when
# a peer-to-peer market has something to do.
#
# Building the environment takes ~30 s and each timestep ~0.15 s, so a full run
# is a couple of minutes -- doubled while `reference: true`. Set `days:` to 2
# or 3 while iterating.
citylearn_root: ../annex96_common_exercise_1
citylearn_schema: ../annex96_common_exercise_1/data/datasets/annex96_ce1_vt_neighborhood/schema.json
days:                      # blank = the dataset's full length

submissions: agents/basic/original_exercise
default_agent: rbc
conflict_policy: first

# --- prices ----------------------------------------------------------------
# CE1 ships no pricing at all, so prices come from here rather than from the
# schema. Swap in real day-ahead data for the matching region and month to make
# this realistic -- ISO-NE for Vermont, ERCOT for Texas.
price_csv:
delivery_adder: 0.075
price_volatility: 0.15
export_price: 0.0          # CE1 rule: no export to the grid
# NOTE the value. The comfort price has to be calibrated to the building stock,
# and these buildings are hard to keep comfortable:
#
#   * the band is the observed setpoint +/- comfort_band -- 16-20 degC on
#     Vermont building 0 -- and it MOVES, by up to 7 K within one building;
#   * the heat pumps are up to 19.5 kW ELECTRIC at a heating COP near 1.2, and
#     one hour at full command moves the indoor temperature about 15 K, so
#     anything that saturates swings the building wildly;
#   * proportional control alone cannot hold these buildings at all. It settles
#     permanently below target against a steady heating load, and widening its
#     band makes in-band worse rather than better. `api.Thermostat` is a PI
#     controller for that reason: 33.3% -> 77.3% of hours inside the band.
#
# The value is set from a measured breakeven, not by feel. Good control pays
# for its own energy only above roughly $0.18/degC-h:
#
#   below that   ignoring comfort is the RATIONAL strategy, which makes the
#                whole comfort term decorative
#   at 0.50      good control pays for its own energy several times over, and
#                comfort is a real term in the bill that still leaves the
#                trading exercise visible
#   at 3.00      comfort is 90% of the bill and the market is irrelevant
#
# Raise it if you want thermal control to be the main event; lower it towards
# 0.18 if you want the market to be. Below 0.18 do not bother having it.
comfort_price: 0.50
price_step: 0.01

# --- compute limits --------------------------------------------------------
call_timeout_seconds: 5.0
run_budget_seconds: 120.0

max_bid_kwh: 500.0
seed: 0

reference: true
out: results/default
save_csv: true
