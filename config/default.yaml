# THE DEFAULT: the real Annex 96 Common Exercise 1 neighbourhood.
# Texas, 25 homes, 720 timesteps (30 days from June).
#
# This needs a clone of the exercise repo and PyTorch. If you have not got
# those yet, use config/mock.yaml -- it needs nothing but numpy and runs a
# week in a tenth of a second. Agent code is identical either way.
#
# Building the environment takes ~30 s and each timestep ~0.15 s, so a full
# 720-step run is about two minutes -- doubled while `reference: true`.
# Develop against config/mock.yaml, which does a week in a tenth of a second,
# then confirm here.
backend: citylearn
citylearn_root: ../annex96_common_exercise_1
citylearn_schema: ../annex96_common_exercise_1/data/datasets/annex96_ce1_tx_neighborhood/schema.json
days:                      # blank = the dataset's full 720 timesteps

submissions: submissions
default_agent: rbc
unclaimed_mode: individual
conflict_policy: first

# --- prices ----------------------------------------------------------------
# CE1 ships no pricing at all, so prices come from here rather than from the
# schema. Swap in real ERCOT day-ahead data for June to make this realistic.
price_csv:
delivery_adder: 0.075
price_volatility: 0.15
export_price: 0.0          # CE1 rule: no export to the grid
# NOTE the value, and why it is not the 3.00 the mock backend uses. The
# comfort price has to be calibrated to the building stock, and these
# buildings are far harder to keep comfortable than the synthetic ones:
#
#   * the band is the observed setpoint +/- comfort_band, about 19.8-23.8 degC
#     on building 0, while June in Texas pushes the fabric to 28 degC unaided;
#   * the heat pumps are ~3.5 kW electric at a COP over 4, so about 15 kW of
#     cooling on a single house, and the LSTM dynamics respond violently to
#     hourly switching -- temperature swings of 6-9 K per step are normal;
#   * measured over 168 steps on five buildings, the best of five simple
#     controllers still leaves 272 degC-h. Compressor permanently off gives
#     5560; permanently full gives 6830, which is WORSE than off because it
#     overshoots below the lower edge of the band.
#
# The value is set from a measured breakeven, not by feel. A smoothed
# thermostat cuts control-attributable exceedance 24-fold (694 -> 29 degC-h over
# 168 hours on all 25 buildings) but spends about 67% more cooling energy. Those
# two balance at roughly $0.18/degC-h:
#
#   below that   ignoring comfort is the RATIONAL strategy, which makes the
#                whole comfort term decorative
#   at 0.50      good control pays for its own energy several times over, and
#                comfort is around 15% of a well-run bill -- a real term that
#                still leaves the trading exercise visible
#   at 3.00      comfort is 90% of the bill and the market is irrelevant
#
# Raise it if you want thermal control to be the main event; lower it towards
# 0.18 if you want the market to be. Below 0.18 do not bother having it.
comfort_price: 0.50
price_step: 0.01

# --- compute limits --------------------------------------------------------
call_timeout_seconds: 5.0
run_budget_seconds: 120.0

max_bid_kwh: 500.0
slow_call_seconds: 1.0
seed: 0

reference: true
out: results/default
save_csv: true
