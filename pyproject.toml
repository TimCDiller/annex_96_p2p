[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annex96-p2p"
version = "0.1.0"
description = "P2P electricity trading exercise adapted from IEA EBC Annex 96 Common Exercise 1"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
citylearn = ["CityLearn>=2.1"]
dev = ["pytest>=7.0"]
# Optional, for submissions that train an agent. Never a hard dependency --
# the clone-and-run promise rests on numpy/pandas/pyyaml alone, and torch is
# a ~200 MB download.
ml = ["torch>=2.0", "scikit-learn>=1.3", "safetensors>=0.4"]
rl = ["torch>=2.0", "gymnasium>=0.29", "stable-baselines3>=2.0", "safetensors>=0.4"]
# For examples/sample_run.py, which writes an interactive HTML booklet.
viz = ["plotly>=5.18"]

[project.scripts]
annex96 = "annex96p2p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
