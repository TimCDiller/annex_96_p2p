[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annex96-p2p"
version = "0.1.0"
description = "P2P electricity trading exercise adapted from IEA EBC Annex 96 Common Exercise 1"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
citylearn = ["CityLearn>=2.1"]
dev = ["pytest>=7.0"]

[project.scripts]
annex96 = "annex96p2p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
