name: altered-stock-classroom
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install classroom runtime
        run: |
          python -m pip install -r scenarios/requirements.txt
          python -m pip install -e .
      - name: Fetch pinned upstream code and data
        run: |
          git clone https://github.com/kkaspar10/annex96_common_exercise_1 ../annex96_common_exercise_1
          git -C ../annex96_common_exercise_1 checkout 28ab31e88f9f4e1559bca7be3aaae8c918a20f83
      - name: Generate portable stock
        run: python -m annex96p2p.altered_stock build
      - name: Verify physics and portability
        run: python -m pytest tests/test_altered_stock.py tests/test_rc_thermal.py -q
      - name: Fit published thermal models
        run: |
          python examples/calibrate_rc.py
          python examples/calibrate_rc.py --dataset generated/altered_stock/solar_abundant --out scenarios/rc_models/solar_abundant.json
      - name: Exercise classroom runner
        run: python -m annex96p2p.altered_stock run --configurations balanced --modes competitive pv_honest pv_withhold --days 2 --out results/classroom-ci
      - name: Exercise RC preheating after calibration
        run: python -m annex96p2p.altered_stock run --configurations balanced --modes rc_preheat --days 9 --out results/rc-ci
