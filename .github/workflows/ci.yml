name: ci

# Students submit by pull request. This runs on a fresh throwaway runner, so
# nothing executes on the instructor's machine. See docs/security.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Static scan FIRST, before anything gets imported.
      - name: Scan submissions for unsafe code
        run: python scripts/scan_submissions.py submissions/

      # Only then execute them, under an external timeout.
      # The dataset is not in CI, so a simulation cannot run here. The
      # contract suite does not need it; test_citylearn.py skips itself.
      - name: Contract tests
        run: python -m pytest -q
